name: Debug & Test Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Definimos los servicios que necesita el boilerplate para no morir
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Run Project Setup
        run: python setup.py local

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Tests
        # Seteamos variables de entorno para que coincidan con los servicios de arriba
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          REDIS_CACHE_HOST: localhost
          REDIS_RATE_LIMIT_HOST: localhost
        run: uv run pytest

